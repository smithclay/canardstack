# Copy to ./config.toml or set CANARDSTACK_CONFIG=/path/to/config.toml.
# Environment variables override matching settings.

[server]
bind = "127.0.0.1:4318"
max_connections = 1024
socket_read_timeout_secs = 30
socket_write_timeout_secs = 30

# [server.tls]
# enabled = true
# mode = "file"
# cert_file = "/etc/canardstack/tls/fullchain.pem"
# key_file = "/etc/canardstack/tls/privkey.pem"
# backend_bind = "127.0.0.1:4319"

[auth]
api_key = "dev-canardstack-key"
admin_api_key = "dev-canardstack-admin-key"

[paths]
data_dir = ".canardstack"
# duckdb_extension_dir = "/usr/local/lib/duckdb/extensions"

[duckdb]
memory_limit = "1GiB"

[ducklake]
# Point this at the DuckLake catalog written by duckdb-otlp.
# attach_uri = "ducklake:/var/lib/canardstack/catalog.ducklake"
# data_path = "/var/lib/canardstack/storage"
#
# Other supported catalog shapes:
# attach_uri = "md:test-ducklake"
# postgres_dsn = "dbname=ducklake_catalog host=localhost user=postgres password=postgres"
#
# Object storage examples:
# data_path = "s3://canardstack-data/prod/"

[query]
concurrency = 4
timeout_secs = 15
memory_limit = "1GiB"
admission_wait_ms = 1000

[admission]
cheap_query_capacity = 1
heavy_query_degraded_capacity = 1

[retention]
days = 14
