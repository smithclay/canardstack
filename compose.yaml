x-duckdb-catalog-image: &duckdb-catalog-image
  platform: ${DUCKDB_OTLP_PLATFORM:-linux/amd64}
  build:
    context: .
    dockerfile: Dockerfile.duckdb-catalog
    args:
      DUCKDB_CATALOG_BASE_IMAGE: ${DUCKDB_CATALOG_BASE_IMAGE:-ghcr.io/smithclay/duckdb-otlp:latest}
  image: ${DUCKDB_CATALOG_IMAGE:-canardstack-duckdb-catalog:local}

x-duckdb-otlp-image: &duckdb-otlp-image
  platform: ${DUCKDB_OTLP_PLATFORM:-linux/amd64}
  image: ${DUCKDB_OTLP_IMAGE:-ghcr.io/smithclay/duckdb-otlp:latest}

services:
  ducklake-catalog:
    <<: *duckdb-catalog-image
    entrypoint: ["/bin/sh", "/usr/local/bin/duckdb-quack-catalog.sh"]
    healthcheck:
      disable: true
    ports:
      - "${QUACK_PORT:-9494}:9494"
    environment:
      HOME: /var/lib/duckdb
      DUCKLAKE_CATALOG_DB: /var/lib/ducklake/catalog/catalog.duckdb
      QUACK_BIND: quack:127.0.0.1:9495
      QUACK_TLS_PORT: "9494"
      QUACK_TOKEN: ${QUACK_TOKEN:-dev-quack-token}
    volumes:
      - duckdb-catalog-home:/var/lib/duckdb
      - ducklake-catalog:/var/lib/ducklake/catalog
      - ./config/compose/duckdb-quack-catalog.sh:/usr/local/bin/duckdb-quack-catalog.sh:ro
    restart: unless-stopped

  ingest:
    <<: *duckdb-otlp-image
    entrypoint: ["/bin/sh", "/usr/local/bin/duckdb-otlp-ingest.sh"]
    depends_on:
      - ducklake-catalog
    ports:
      - "${OTLP_PORT:-4318}:4318"
    environment:
      HOME: /var/lib/duckdb
      DUCKDB_INGEST_DB: /var/lib/duckdb/ingest.duckdb
      DUCKLAKE_ATTACH_URI: ducklake:quack:ducklake-catalog:9494
      DUCKLAKE_DATA_PATH: /var/lib/ducklake/data/
      OTLP_BIND: otlp:0.0.0.0:4318
      OTLP_TOKEN: ${OTLP_TOKEN:-dev-otlp-token-123456}
      QUACK_TOKEN: ${QUACK_TOKEN:-dev-quack-token}
    volumes:
      - duckdb-ingest-home:/var/lib/duckdb
      - ducklake-data:/var/lib/ducklake/data
      - ./config/compose/duckdb-otlp-ingest.sh:/usr/local/bin/duckdb-otlp-ingest.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4318/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 24
    restart: unless-stopped

  canardstack:
    image: ${CANARDSTACK_IMAGE:-ghcr.io/smithclay/canardstack:latest}
    depends_on:
      ducklake-catalog:
        condition: service_started
      ingest:
        condition: service_healthy
    ports:
      - "${CANARDSTACK_PORT:-9090}:9090"
    environment:
      CANARDSTACK_BIND: 0.0.0.0:9090
      CANARDSTACK_API_KEY: ${CANARDSTACK_API_KEY:-dev-canardstack-key}
      CANARDSTACK_ADMIN_API_KEY: ${CANARDSTACK_ADMIN_API_KEY:-dev-canardstack-admin-key}
      CANARDSTACK_DATA_DIR: /var/lib/canardstack
      CANARDSTACK_DUCKLAKE_ATTACH_URI: ${CANARDSTACK_DUCKLAKE_ATTACH_URI:-ducklake:quack:ducklake-catalog:9494}
      CANARDSTACK_DUCKLAKE_DATA_PATH: ${CANARDSTACK_DUCKLAKE_DATA_PATH:-/var/lib/ducklake/data/}
      CANARDSTACK_DUCKLAKE_QUACK_TOKEN: ${QUACK_TOKEN:-dev-quack-token}
      CANARDSTACK_DUCKLAKE_QUACK_INSECURE_TLS: "true"
      motherduck_token: ${motherduck_token:-}
    volumes:
      - canardstack-data:/var/lib/canardstack
      - ducklake-data:/var/lib/ducklake/data
    healthcheck:
      test: ["CMD", "canardstack", "healthcheck", "--endpoint", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    restart: on-failure

  grafana:
    image: grafana/grafana-oss:latest
    depends_on:
      canardstack:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      CANARDSTACK_API_KEY: ${CANARDSTACK_API_KEY:-dev-canardstack-key}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  canardstack-data:
  duckdb-catalog-home:
  duckdb-ingest-home:
  ducklake-catalog:
  ducklake-data:
  grafana-data:
