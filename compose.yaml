services:
  canardstack:
    image: ${CANARDSTACK_IMAGE:-ghcr.io/smithclay/canardstack:latest}
    ports:
      - "4318:4318"
    environment:
      CANARDSTACK_BIND: 0.0.0.0:4318
      CANARDSTACK_API_KEY: ${CANARDSTACK_API_KEY:-dev-canardstack-key}
      CANARDSTACK_ADMIN_API_KEY: ${CANARDSTACK_ADMIN_API_KEY:-dev-canardstack-admin-key}
      CANARDSTACK_DATA_DIR: /var/lib/canardstack
      CANARDSTACK_DUCKDB_EXTENSION_DIR: /usr/local/lib/duckdb/extensions
      CANARDSTACK_DUCKLAKE_ATTACH_URI: ${CANARDSTACK_DUCKLAKE_ATTACH_URI:-}
      motherduck_token: ${motherduck_token:-${MOTHERDUCK_TOKEN:-}}
    volumes:
      - canardstack-data:/var/lib/canardstack
    healthcheck:
      test: ["CMD", "canardstack", "healthcheck", "http://127.0.0.1:4318/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  grafana:
    image: grafana/grafana-oss:latest
    depends_on:
      canardstack:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      CANARDSTACK_API_KEY: ${CANARDSTACK_API_KEY:-dev-canardstack-key}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro

  smoke:
    profiles: ["smoke"]
    image: ${CANARDSTACK_IMAGE:-ghcr.io/smithclay/canardstack:latest}
    depends_on:
      canardstack:
        condition: service_healthy
    environment:
      CANARDSTACK_API_KEY: ${CANARDSTACK_API_KEY:-dev-canardstack-key}
      CANARDSTACK_ADMIN_API_KEY: ${CANARDSTACK_ADMIN_API_KEY:-dev-canardstack-admin-key}
    command: ["canardstack", "smoke-http", "http://canardstack:4318"]

  canardstack-bench:
    profiles: ["bench"]
    image: ${CANARDSTACK_IMAGE:-ghcr.io/smithclay/canardstack:latest}
    ports:
      - "4319:4318"
    cpus: "${CANARDSTACK_BENCH_CPUS:-2.0}"
    mem_limit: "${CANARDSTACK_BENCH_MEMORY:-4g}"
    memswap_limit: "${CANARDSTACK_BENCH_MEMORY:-4g}"
    labels:
      canardstack.benchmark.cpus: "${CANARDSTACK_BENCH_CPUS:-2.0}"
      canardstack.benchmark.memory: "${CANARDSTACK_BENCH_MEMORY:-4g}"
    environment:
      CANARDSTACK_BIND: 0.0.0.0:4318
      CANARDSTACK_API_KEY: ${CANARDSTACK_API_KEY:-dev-canardstack-key}
      CANARDSTACK_ADMIN_API_KEY: ${CANARDSTACK_ADMIN_API_KEY:-dev-canardstack-admin-key}
      CANARDSTACK_DATA_DIR: /var/lib/canardstack
      CANARDSTACK_DUCKDB_EXTENSION_DIR: /usr/local/lib/duckdb/extensions
      CANARDSTACK_DUCKLAKE_ATTACH_URI: ${CANARDSTACK_DUCKLAKE_ATTACH_URI:-}
      CANARDSTACK_DUCKDB_MEMORY_LIMIT: ${CANARDSTACK_BENCH_DUCKDB_MEMORY_LIMIT:-1GiB}
      CANARDSTACK_PROCESS_MEMORY_LIMIT_BYTES: ${CANARDSTACK_BENCH_PROCESS_MEMORY_LIMIT_BYTES:-3221225472}
      CANARDSTACK_BENCHMARK_CPU_LIMIT: ${CANARDSTACK_BENCH_CPUS:-2.0}
      CANARDSTACK_BENCHMARK_MEMORY_LIMIT: ${CANARDSTACK_BENCH_MEMORY:-4g}
      CANARDSTACK_BENCHMARK_RESOURCE_NOTE: "Docker VM capped to ${CANARDSTACK_BENCH_CPUS:-2.0} CPU / ${CANARDSTACK_BENCH_MEMORY:-4g} memory; not cloud-equivalent Linux hardware"
      motherduck_token: ${motherduck_token:-${MOTHERDUCK_TOKEN:-}}
    volumes:
      - canardstack-bench-data:/var/lib/canardstack
    healthcheck:
      test: ["CMD", "canardstack", "healthcheck", "http://127.0.0.1:4318/healthz"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  canardstack-data:
  canardstack-bench-data:
  grafana-data:
