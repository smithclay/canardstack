AWSTemplateFormatVersion: "2010-09-09"
Description: >
  canardstack on ECS/Fargate. The same canardstack image runs the public app
  (canardstack serve) and an internal DuckLake/Quack catalog service
  (canardstack serve-catalog), with S3 DuckLake data files and a service-managed
  EBS volume for the DuckDB-backed DuckLake catalog metadata file.

Parameters:
  ClusterName:
    Type: String
    Default: canardstack
  ServiceName:
    Type: String
    Default: canardstack
  CatalogServiceName:
    Type: String
    Default: canardstack-catalog
  ServiceDiscoveryNamespaceName:
    Type: String
    Default: canardstack.local
  CatalogServiceDiscoveryName:
    Type: String
    Default: catalog
  Image:
    Type: String
    Default: ghcr.io/smithclay/canardstack:latest
    Description: Public GHCR canardstack image.
  CatalogImage:
    Type: String
    Default: ghcr.io/smithclay/canardstack:latest
    Description: Catalog image. Defaults to the same canardstack image as the app; the catalog container runs `canardstack serve-catalog`, which serves the DuckLake catalog DuckDB file over the Quack protocol.
  VpcCidr:
    Type: String
    Default: 10.78.0.0/16
  PublicSubnetOneCidr:
    Type: String
    Default: 10.78.0.0/24
  PublicSubnetTwoCidr:
    Type: String
    Default: 10.78.1.0/24
  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
  UseLoadBalancer:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Front the app with an internet-facing ALB (stable HTTP endpoint). Default false exposes the app task directly with in-binary TLS (ephemeral self-signed cert; clients must skip verification) on port 4318 and drops the ALB cost. The container port stays 4318 in both modes so the transition is atomic on the ECS service.
  S3BucketName:
    Type: String
    Default: ""
    Description: Optional S3 bucket name for DuckLake data files. Leave empty to generate one.
  S3DataPrefix:
    Type: String
    Default: ducklake-data
  ApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Ingest API key. Leave empty to auto-generate a random 40-char key in Secrets Manager; fetch it via the stack outputs after deploy.
  AdminApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Admin/operator API key. Leave empty to auto-generate a random 40-char key in Secrets Manager; fetch it via the stack outputs after deploy.
  QuackToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Shared token between canardstack and the Quack catalog. Leave empty to auto-generate a random 40-char token in Secrets Manager; fetch it via the stack outputs after deploy.
  Cpu:
    Type: String
    Default: "512"
  Memory:
    Type: String
    Default: "1024"
  CatalogCpu:
    Type: String
    Default: "256"
  CatalogMemory:
    Type: String
    Default: "1024"
  CatalogPort:
    Type: Number
    Default: 9494
  AppContainerUser:
    Type: String
    Default: "0"
    Description: Container user override for canardstack. The default can write the root-owned EBS mount.
  CatalogContainerUser:
    Type: String
    Default: "0"
    Description: Container user override for the catalog image. The default can write the root-owned catalog mount.
  AppEbsSizeGiB:
    Type: Number
    Default: 20
  ProcessMemoryLimitBytes:
    Type: Number
    Default: 536870912
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
      - ARM64
      - X86_64
    Description: Fargate CPU architecture for both tasks. ARM64 (Graviton) is ~20% cheaper; the canardstack image is multi-arch so it runs on either.

Conditions:
  HasS3BucketName:
    Fn::Not:
      - Fn::Equals:
          - !Ref S3BucketName
          - ""
  GenerateApiKey:
    Fn::Equals:
      - !Ref ApiKey
      - ""
  GenerateAdminApiKey:
    Fn::Equals:
      - !Ref AdminApiKey
      - ""
  GenerateQuackToken:
    Fn::Equals:
      - !Ref QuackToken
      - ""
  WithAlb:
    Fn::Equals:
      - !Ref UseLoadBalancer
      - "true"
  DirectTls:
    Fn::Equals:
      - !Ref UseLoadBalancer
      - "false"

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-a

  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetOne
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetTwo
      RouteTableId: !Ref PublicRouteTable

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ServiceName}
      RetentionInDays: 14

  CatalogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${CatalogServiceName}
      RetentionInDays: 14

  DuckLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::If:
          - HasS3BucketName
          - !Ref S3BucketName
          - !Ref AWS::NoValue
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ServiceName}/api-key
      SecretString:
        Fn::If:
          - GenerateApiKey
          - !Ref AWS::NoValue
          - !Ref ApiKey
      GenerateSecretString:
        Fn::If:
          - GenerateApiKey
          - PasswordLength: 40
            ExcludePunctuation: true
          - !Ref AWS::NoValue

  AdminApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ServiceName}/admin-api-key
      SecretString:
        Fn::If:
          - GenerateAdminApiKey
          - !Ref AWS::NoValue
          - !Ref AdminApiKey
      GenerateSecretString:
        Fn::If:
          - GenerateAdminApiKey
          - PasswordLength: 40
            ExcludePunctuation: true
          - !Ref AWS::NoValue

  QuackTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${CatalogServiceName}/quack-token
      SecretString:
        Fn::If:
          - GenerateQuackToken
          - !Ref AWS::NoValue
          - !Ref QuackToken
      GenerateSecretString:
        Fn::If:
          - GenerateQuackToken
          - PasswordLength: 40
            ExcludePunctuation: true
          - !Ref AWS::NoValue

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-canardstack-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref ApiKeySecret
                  - !Ref AdminApiKeySecret
                  - !Ref QuackTokenSecret

  AppTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ducklake-s3-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DuckLakeBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      # DuckLake CHECKPOINT scans the data-path root (no trailing
                      # slash) for files scheduled for deletion, so the bare prefix
                      # must be listable in addition to everything beneath it.
                      - !Ref S3DataPrefix
                      - !Sub ${S3DataPrefix}/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                # The bare-key resource (no trailing slash) covers the data-path
                # root that CHECKPOINT reads via read_blob; without it the GET is
                # denied (403) and CHECKPOINT aborts before any compaction runs.
                Resource:
                  - !Sub ${DuckLakeBucket.Arn}/${S3DataPrefix}
                  - !Sub ${DuckLakeBucket.Arn}/${S3DataPrefix}/*
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  CatalogTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # DuckLake CHECKPOINT over a Quack catalog runs its file-deletion scan as
        # catalog-side SQL (read_blob over the data path) on this node, so the
        # catalog -- not just the app -- needs object-store access. Mirrors the
        # AppTaskRole data policy, including the bare-root coverage.
        - PolicyName: ducklake-s3-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DuckLakeBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref S3DataPrefix
                      - !Sub ${S3DataPrefix}/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub ${DuckLakeBucket.Arn}/${S3DataPrefix}
                  - !Sub ${DuckLakeBucket.Arn}/${S3DataPrefix}/*
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  EcsInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRolePolicyForVolumes

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WithAlb
    Properties:
      GroupDescription: canardstack load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: canardstack app
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # ALB mode: only the load balancer reaches the plaintext app on 4318.
        # Direct mode: the in-binary TLS terminator is exposed to AllowedIngressCidr
        # on 4318 (clients use HTTPS with insecure/skip-verify).
        - !If
          - WithAlb
          - IpProtocol: tcp
            FromPort: 4318
            ToPort: 4318
            SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          - IpProtocol: tcp
            FromPort: 4318
            ToPort: 4318
            CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  CatalogSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: canardstack DuckDB Quack catalog
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref CatalogPort
          ToPort: !Ref CatalogPort
          SourceSecurityGroupId: !Ref AppSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Durable catalog storage. canardstack.ducklake is the index over the immutable
  # S3 Parquet data; on a service-managed EBS volume it is per-task and destroyed
  # on every catalog task replacement (services force deleteOnTermination=true),
  # which orphans the S3 data. EFS persists it across deploys/restarts.
  # NOTE: DuckDB advises against read-write database files on NFS; this is
  # acceptable here only because serve-catalog is the single writer. For a
  # stronger durability guarantee use a Postgres catalog instead.
  CatalogEfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: canardstack catalog EFS mount targets
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref CatalogSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  CatalogFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      BackupPolicy:
        Status: ENABLED
      FileSystemTags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-catalog

  CatalogAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref CatalogFileSystem
      RootDirectory:
        Path: /catalog
        CreationInfo:
          OwnerUid: "0"
          OwnerGid: "0"
          Permissions: "0755"

  CatalogMountTargetOne:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref CatalogFileSystem
      SubnetId: !Ref PublicSubnetOne
      SecurityGroups:
        - !Ref CatalogEfsSecurityGroup

  CatalogMountTargetTwo:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref CatalogFileSystem
      SubnetId: !Ref PublicSubnetTwo
      SecurityGroups:
        - !Ref CatalogEfsSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: WithAlb
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetOne
        - !Ref PublicSubnetTwo

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: WithAlb
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 4318
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: WithAlb
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  PrivateDnsNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref ServiceDiscoveryNamespaceName
      Vpc: !Ref Vpc

  CatalogDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref CatalogServiceDiscoveryName
      NamespaceId: !Ref PrivateDnsNamespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt AppTaskRole.Arn
      Volumes:
        - Name: canardstack-data
          ConfiguredAtLaunch: true
      ContainerDefinitions:
        - Name: canardstack
          Image: !Ref Image
          Essential: true
          User: !Ref AppContainerUser
          Command:
            - canardstack
            - serve
          PortMappings:
            - ContainerPort: 4318
              Protocol: tcp
          Environment:
            # Container port is 4318 in both modes (so the ECS service can switch
            # between ALB and direct without the LoadBalancers/task-def port
            # mismatch that blocks an atomic update). ALB mode: plaintext on 4318.
            # Direct mode: in-binary TLS terminator on 4318 (ephemeral self-signed
            # cert; clients skip-verify) forwarding to a plaintext backend on
            # 127.0.0.1:4319; the health check probes 4319 in direct mode.
            - Name: CANARDSTACK_BIND
              Value: 0.0.0.0:4318
            - Name: CANARDSTACK_TLS_ENABLED
              Value: !If [WithAlb, "false", "true"]
            - Name: CANARDSTACK_TLS_MODE
              Value: ephemeral_self_signed
            - Name: CANARDSTACK_TLS_BACKEND_BIND
              Value: 127.0.0.1:4319
            - Name: CANARDSTACK_DATA_DIR
              Value: /var/lib/canardstack
            - Name: CANARDSTACK_DUCKDB_EXTENSION_DIR
              Value: /usr/local/lib/duckdb/extensions
            - Name: CANARDSTACK_DUCKLAKE_ATTACH_URI
              Value: !Sub ducklake:quack:${CatalogServiceDiscoveryName}.${ServiceDiscoveryNamespaceName}:${CatalogPort}
            # The catalog terminates TLS with a self-signed cert (no managed TLS
            # on ECS), so skip cert verification for the catalog URL only; the
            # Quack token authenticates and TLS encrypts in transit.
            - Name: CANARDSTACK_DUCKLAKE_QUACK_INSECURE_TLS
              Value: "true"
            - Name: CANARDSTACK_DUCKLAKE_DATA_PATH
              Value: !Sub s3://${DuckLakeBucket}/${S3DataPrefix}/
            # Region for the DuckDB S3 credential_chain secret and the AWS SDK
            # chain that resolves the task role; the DuckLake bucket lives here.
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: CANARDSTACK_DUCKLAKE_MAINTENANCE_ENABLED
              Value: "true"
            - Name: CANARDSTACK_PROCESS_MEMORY_LIMIT_BYTES
              Value: !Sub ${ProcessMemoryLimitBytes}
          Secrets:
            - Name: CANARDSTACK_API_KEY
              ValueFrom: !Ref ApiKeySecret
            - Name: CANARDSTACK_ADMIN_API_KEY
              ValueFrom: !Ref AdminApiKeySecret
            - Name: CANARDSTACK_DUCKLAKE_QUACK_TOKEN
              ValueFrom: !Ref QuackTokenSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: canardstack
          HealthCheck:
            Command:
              - CMD-SHELL
              - !If
                - WithAlb
                - canardstack healthcheck http://127.0.0.1:4318/healthz
                - canardstack healthcheck http://127.0.0.1:4319/healthz
            Interval: 10
            Timeout: 5
            Retries: 6
            StartPeriod: 30
          MountPoints:
            - SourceVolume: canardstack-data
              ContainerPath: /var/lib/canardstack

  CatalogTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref CatalogServiceName
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      Cpu: !Ref CatalogCpu
      Memory: !Ref CatalogMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt CatalogTaskRole.Arn
      Volumes:
        - Name: duckdb-catalog
          EFSVolumeConfiguration:
            FilesystemId: !Ref CatalogFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref CatalogAccessPoint
      ContainerDefinitions:
        - Name: canardstack-catalog
          Image: !Ref CatalogImage
          Essential: true
          User: !Ref CatalogContainerUser
          Command:
            - canardstack
            - serve-catalog
          PortMappings:
            - ContainerPort: !Ref CatalogPort
              Protocol: tcp
          Environment:
            - Name: CANARDSTACK_DATA_DIR
              Value: /var/lib/canardstack
            - Name: CANARDSTACK_DUCKLAKE_CATALOG_PATH
              Value: /var/lib/canardstack/canardstack.ducklake
            - Name: CANARDSTACK_DUCKDB_EXTENSION_DIR
              Value: /usr/local/lib/duckdb/extensions
            # Terminate TLS in-binary (ECS has no managed TLS for Cloud Map names):
            # serve TLS on CatalogPort and forward to a loopback plaintext Quack.
            - Name: CANARDSTACK_CATALOG_TLS
              Value: "true"
            - Name: CANARDSTACK_CATALOG_LISTEN
              Value: !Sub 0.0.0.0:${CatalogPort}
            - Name: CANARDSTACK_CATALOG_QUACK_BACKEND
              Value: 127.0.0.1:9495
            - Name: CANARDSTACK_CATALOG_HEALTH_BIND
              Value: 0.0.0.0:8080
            # serve-catalog configures object-store credentials from the data path
            # so DuckLake's catalog-side CHECKPOINT file-deletion scan can read S3.
            - Name: CANARDSTACK_DUCKLAKE_DATA_PATH
              Value: !Sub s3://${DuckLakeBucket}/${S3DataPrefix}/
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: CANARDSTACK_DUCKLAKE_QUACK_TOKEN
              ValueFrom: !Ref QuackTokenSecret
          HealthCheck:
            Command:
              - CMD-SHELL
              - canardstack healthcheck http://127.0.0.1:8080/healthz
            Interval: 10
            Timeout: 5
            Retries: 6
            StartPeriod: 30
          MountPoints:
            - SourceVolume: duckdb-catalog
              ContainerPath: /var/lib/canardstack
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CatalogLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: canardstack-catalog

  CatalogService:
    Type: AWS::ECS::Service
    DependsOn:
      - CatalogMountTargetOne
      - CatalogMountTargetTwo
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Ref CatalogServiceName
      TaskDefinition: !Ref CatalogTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      ServiceRegistries:
        - RegistryArn: !GetAtt CatalogDiscoveryService.Arn
          ContainerName: canardstack-catalog
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref CatalogSecurityGroup
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo

  AppService:
    Type: AWS::ECS::Service
    DependsOn:
      - CatalogService
    Metadata:
      # ALB mode requires the listener (which attaches the target group to the
      # load balancer) to exist before the service registers targets. DependsOn
      # can't be conditional, so this conditional Ref creates that implicit
      # dependency only when the ALB is enabled; in direct mode it is NoValue.
      AlbListenerDependency: !If [WithAlb, !Ref Listener, !Ref "AWS::NoValue"]
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Ref ServiceName
      TaskDefinition: !Ref AppTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers: !If
        - WithAlb
        - - ContainerName: canardstack
            ContainerPort: 4318
            TargetGroupArn: !Ref TargetGroup
        - !Ref "AWS::NoValue"
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref AppSecurityGroup
          Subnets:
            - !Ref PublicSubnetOne
            - !Ref PublicSubnetTwo
      VolumeConfigurations:
        - Name: canardstack-data
          ManagedEBSVolume:
            RoleArn: !GetAtt EcsInfrastructureRole.Arn
            SizeInGiB: !Ref AppEbsSizeGiB
            VolumeType: gp3
            Encrypted: true
            FilesystemType: ext4

Outputs:
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  ServiceArn:
    Value: !Ref AppService
  CatalogServiceArn:
    Value: !Ref CatalogService
  ServiceUrl:
    Condition: WithAlb
    Value: !Sub http://${LoadBalancer.DNSName}
  DirectTlsEndpoint:
    Condition: DirectTls
    Description: >-
      No ALB: the app task is exposed directly with in-binary TLS (ephemeral
      self-signed cert) on port 4318. The task public IP is ephemeral and
      changes on every deploy/restart; look it up, then use
      https://<public-ip>:4318 with insecure/skip-verify.
    Value: !Sub >-
      aws ecs describe-tasks --cluster ${ClusterName} --region ${AWS::Region}
      --tasks $(aws ecs list-tasks --cluster ${ClusterName} --service-name ${ServiceName}
      --query 'taskArns[0]' --output text) --query
      "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text
      | xargs -I{} aws ec2 describe-network-interfaces --network-interface-ids {}
      --query 'NetworkInterfaces[0].Association.PublicIp' --output text  # then https://<ip>:4318
  DuckLakeAttachUri:
    Value: !Sub ducklake:quack:${CatalogServiceDiscoveryName}.${ServiceDiscoveryNamespaceName}:${CatalogPort}
  DuckLakeDataPath:
    Value: !Sub s3://${DuckLakeBucket}/${S3DataPrefix}/
  ApiKeySecretArn:
    Value: !Ref ApiKeySecret
  AdminApiKeySecretArn:
    Value: !Ref AdminApiKeySecret
  QuackTokenSecretArn:
    Value: !Ref QuackTokenSecret
  ApiKeyRetrieveCommand:
    Description: Fetch the (possibly auto-generated) ingest API key from Secrets Manager.
    Value: !Sub "aws secretsmanager get-secret-value --secret-id ${ApiKeySecret} --query SecretString --output text"
  AdminApiKeyRetrieveCommand:
    Description: Fetch the (possibly auto-generated) admin API key from Secrets Manager.
    Value: !Sub "aws secretsmanager get-secret-value --secret-id ${AdminApiKeySecret} --query SecretString --output text"
  QuackTokenRetrieveCommand:
    Description: Fetch the (possibly auto-generated) Quack token from Secrets Manager.
    Value: !Sub "aws secretsmanager get-secret-value --secret-id ${QuackTokenSecret} --query SecretString --output text"
