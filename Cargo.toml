[package]
name = "canardstack"
version = "0.0.8"
edition = "2021"
license = "Apache-2.0"
description = "Single-binary OpenTelemetry observability backend backed by DuckLake"
repository = "https://github.com/smithclay/canardstack"
homepage = "https://smithclay.github.io/canardstack/"
readme = "README.md"
keywords = ["observability", "opentelemetry", "otlp", "duckdb", "ducklake"]
categories = ["command-line-utilities", "development-tools::debugging", "database"]
include = [
    "/benches",
    "/canardstack.png",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src",
    "/tests",
]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["clock"] }
duckdb = { version = "1.10503.1", features = ["bundled"] }
otlp2records = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml_edit = { version = "0.25.11", default-features = false, features = ["parse"] }
tracing = "0.1.44"
base64 = { version = "0.22.1", optional = true }
# Optional: only pulled in for the `tls` feature (in-binary TLS shims).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["ring"], optional = true }

[features]
default = []
detailed-metrics = []
# In-binary TLS termination for `serve` (rustls + PEM cert/key
# files, with an explicit ephemeral self-signed mode). Off by default to keep the
# lean build.
tls = ["dep:base64", "dep:rustls", "dep:rcgen"]

[dev-dependencies]
tempfile = "3.27.0"
