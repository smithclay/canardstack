[package]
name = "canardstack"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["clock", "serde"] }
arrow58 = { package = "arrow", version = "58", default-features = false, features = ["ffi", "ipc", "json"] }
duckdb = { version = "1.10502.0", features = ["bundled"] }
flate2 = "1.1.9"
otlp2records = { version = "0.5.1", features = ["parquet"] }
opentelemetry-proto = { version = "0.31.0", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3.27.0"

[[bench]]
name = "throughput_iteration"
harness = false
